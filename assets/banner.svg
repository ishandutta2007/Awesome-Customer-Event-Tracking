<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="glowG1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowG2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for soft neon glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.35; }
      }
      @keyframes floatParticle1 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-25px) translateX(35px); opacity: 0.9; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes floatParticle2 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
        50% { transform: translateY(20px) translateX(-30px); opacity: 1; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      }
      @keyframes streamDash {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes badgePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      .grid-layer { animation: pulseGrid 8s ease-in-out infinite; }
      .p1 { animation: floatParticle1 6s ease-in-out infinite; }
      .p2 { animation: floatParticle2 7s ease-in-out infinite; }
      .stream-line {
        stroke-dasharray: 12, 16;
        animation: streamDash 15s linear infinite;
      }
      .stream-line-rev {
        stroke-dasharray: 8, 12;
        animation: streamDash 10s linear infinite reverse;
      }
      .badge-card {
        transform-origin: center;
        animation: badgePulse 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />

  <!-- Ambient Glow Spots -->
  <rect width="1200" height="360" fill="url(#glowG1)" rx="16" />
  <rect width="1200" height="360" fill="url(#glowG2)" rx="16" />

  <!-- Background Dynamic Mesh & Pipelines -->
  <g class="grid-layer" stroke="#334155" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Animated Telemetry Event Streams (Background Flow) -->
  <path class="stream-line" d="M -50 90 Q 300 20 600 90 T 1250 90" fill="none" stroke="url(#streamGrad)" stroke-width="2.5" />
  <path class="stream-line-rev" d="M -50 280 Q 350 330 700 280 T 1250 280" fill="none" stroke="url(#streamGrad)" stroke-width="2" />
  <path class="stream-line" d="M -50 190 Q 400 250 800 160 T 1250 200" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Animated Event Packets (Telemetry Pulses) -->
  <g class="p1">
    <circle cx="210" cy="85" r="5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="580" cy="90" r="4" fill="#818cf8" filter="url(#glow)" />
    <circle cx="950" cy="80" r="6" fill="#c084fc" filter="url(#glow)" />
    <circle cx="1110" cy="220" r="4" fill="#38bdf8" filter="url(#glow)" />
  </g>
  <g class="p2">
    <circle cx="160" cy="285" r="4" fill="#c084fc" filter="url(#glow)" />
    <circle cx="510" cy="295" r="5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="820" cy="275" r="4.5" fill="#818cf8" filter="url(#glow)" />
    <circle cx="90" cy="190" r="3.5" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Crisp Decorative Category Badges (Flowing in lower-middle background) -->
  <g opacity="0.65" transform="translate(0, 0)">
    <!-- Pill 1: Web Pixels -->
    <rect x="75" y="40" width="135" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="142" y="58" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📡 Web Pixels API</text>

    <!-- Pill 2: Server-Side CAPI -->
    <rect x="990" y="40" width="140" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <text x="1060" y="58" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Server-Side CAPI</text>

    <!-- Pill 3: Self-Hosted CDP -->
    <rect x="85" y="290" width="145" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <text x="157" y="308" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🗄️ Self-Hosted CDP</text>

    <!-- Pill 4: Real-time Telemetry -->
    <rect x="980" y="290" width="150" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
    <text x="1055" y="308" fill="#f5d0fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📊 Real-Time Analytics</text>
  </g>

  <!-- FOREGROUND: Guaranteed High-Contrast Title & Subtitle Safe Zone -->
  <g transform="translate(600, 140)">
    <!-- Main Icon Header -->
    <text x="0" y="-25" text-anchor="middle" font-size="28">🎯 ⚡ 📡</text>

    <!-- Main Title -->
    <text x="0" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5px">
      Customer Event Tracking
    </text>

    <!-- Subtitle -->
    <text x="0" y="65" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.3px">
      Curated Ecosystem of Event Pipelines, CDPs, Tag Management &amp; Behavioral Telemetry
    </text>

    <!-- Tagline Badges in Foreground -->
    <g transform="translate(0, 92)">
      <rect x="-240" y="0" width="145" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="-167" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SaaS &amp; Cloud CDPs</text>

      <rect x="-80" y="0" width="160" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="16" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Open-Source Engines</text>

      <rect x="95" y="0" width="145" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="167" y="16" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Server-Side Tracking</text>
    </g>
  </g>
</svg>
